# Review paid compute/database plans in Render before creating these resources.
services:
  - type: web
    name: teamsync-api
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    rootDir: backend
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: bash bin/build.sh
    preDeployCommand: bash bin/release.sh
    startCommand: bash bin/start.sh
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        sync: false
      - key: DJANGO_TRUST_PROXY
        value: "true"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: DB_ENGINE
        value: postgresql
      - key: DB_SSLMODE
        value: require
      - key: DB_NAME
        fromDatabase:
          name: teamsync-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: teamsync-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: teamsync-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: teamsync-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: teamsync-db
          property: port

databases:
  - name: teamsync-db
    plan: 0.1c-256mb
    diskSizeGB: 1
    region: frankfurt
    postgresMajorVersion: "17"
    ipAllowList: []
