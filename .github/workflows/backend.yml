name: Backend checks

on:
  push:
    branches: [main, "dev/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python backend/manage.py check
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py test accounts organizations projects tasks config

  postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: teamsync_ci
          POSTGRES_USER: teamsync_ci
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teamsync_ci -d teamsync_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_ENGINE: postgresql
      DB_NAME: teamsync_ci
      DB_USER: teamsync_ci
      DB_PASSWORD: ci-test-only
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python backend/manage.py migrate --noinput
      - run: python backend/manage.py check
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py test accounts organizations projects tasks config
      - name: Validate production settings
        run: python backend/manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_ENV: production
          DJANGO_SECRET_KEY: ci-check-only-0123456789-ABCDEFGHIJKLMNOPQRSTUVWXYZ-abcdefghijklmnopqrstuvwxyz
          DJANGO_ALLOWED_HOSTS: api.example.com
          FRONTEND_ORIGIN: https://app.example.com
          DEFAULT_FROM_EMAIL: teamsync@example.com
          RESEND_API_KEY: ci-check-only
          DB_SSLMODE: require
